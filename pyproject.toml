[project]
name = "slidegen-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=6.21.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.4",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "langsmith>=0.10.12",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "tavily>=1.1.0",
    "tiktoken>=0.13.0",
    "ragas>=0.2.0,<0.3.0",
    "matplotlib>=3.10.0",
    "scikit-learn>=1.5.0",
    "umap-learn>=0.5.6",
    # Previously transitive-only; imported directly so declared explicitly:
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs stubbed LLM/tools, slower than pure unit tests",
    "live: needs a real LLM/embedding endpoint, never run in CI",
]
asyncio_mode = "auto"
