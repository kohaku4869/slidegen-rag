[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slidegen-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "gradio>=6.21.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.4",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "langchain-openai>=1.4.3",
    "langgraph>=1.2.10",
    "langsmith>=0.10.12",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "tavily>=1.1.0",
    "tiktoken>=0.13.0",
    "ragas>=0.2.0,<0.3.0",
    "matplotlib>=3.10.0",
    # Previously transitive-only; imported directly so declared explicitly:
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.0",
    "torch>=2.13.0",
    "sqlalchemy>=2.0.52",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "streamlit>=1.64.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    "python-multipart>=0.0.32",
]

[project.scripts]
slidegen-ingest = "slidegen_rag.ingest:main"
slidegen-ask = "slidegen_rag.main:main"
slidegen-api = "slidegen_rag.api.__main__:main"

[tool.hatch.build.targets.wheel]
# `ui` sống ở repo root (KHÔNG dưới src/slidegen_rag) — tách hẳn khỏi package
# backend để sẵn sàng thay bằng một frontend khác; khai báo ở đây để hatchling
# cài nó như 1 top-level package thứ hai trong cùng editable install (import
# `ui`/`ui.xxx` hoạt động ở mọi nơi venv được kích hoạt: streamlit, pytest,
# API server).
packages = ["src/slidegen_rag", "ui"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs stubbed LLM/tools, slower than pure unit tests",
    "live: needs a real LLM/embedding endpoint, never run in CI",
]
asyncio_mode = "auto"
