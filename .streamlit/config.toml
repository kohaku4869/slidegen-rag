[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1F2330"
font = "sans serif"
baseRadius = "medium"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

# Watcher của Streamlit duyệt mọi module `transformers` và import thử các
# image_processing cần `torchvision` (không dùng ở đây) -> spam "No module
# named 'torchvision'" lúc khởi động. Chỉ log nhiễu, không ảnh hưởng chạy;
# hạ mức log để giữ hot-reload mà khỏi phải cài torchvision.
[logger]
level = "error"

[browser]
gatherUsageStats = false
